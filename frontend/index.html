<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BIOMED XPERT · Sales CRM</title>
    <meta name="description" content="BIOMED XPERT sales CRM for biomedical equipment: customers, lead pipeline, quotes, follow-ups and revenue reports in one place." />
    <meta name="theme-color" content="#f4f4f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="BIOMED XPERT" />
    <meta name="apple-mobile-web-app-title" content="BIOMED XPERT" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BIOMED XPERT Sales CRM" />
    <meta property="og:description" content="Track every biomedical equipment deal from first call to installation." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem("bmx-theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>BIOMED XPERT needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
